<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tab-triage</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <section id="consent" class="banner warn hidden">
      Before the first sort, review what gets sent to the classifier.
      <button id="open-consent">Review and accept</button>
    </section>

    <section class="actions">
      <button id="sort" class="tile primary">Sort tabs</button>
      <button id="undo" class="tile" disabled aria-label="Undo the last sort">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        Undo
      </button>
    </section>

    <section class="threshold" aria-labelledby="t-label">
      <div id="t-label" class="label">Only group when at least this sure</div>
      <div class="stepper">
        <button id="t-down" class="tile" aria-label="Lower the threshold by 0.05">−0.05</button>
        <output id="tval" class="tile value" aria-live="polite">0.80</output>
        <button id="t-up" class="tile" aria-label="Raise the threshold by 0.05">+0.05</button>
      </div>
      <div id="presets" class="presets" role="group" aria-label="Threshold presets"></div>
    </section>

    <div id="message" class="banner hidden" role="status" aria-live="polite"></div>

    <section id="summary" class="summary hidden"></section>
    <ol id="results" aria-label="Results"></ol>

    <footer>
      <div id="metrics" class="metrics"></div>
      <button id="options" class="icon" aria-label="Options" title="Options">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </footer>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
